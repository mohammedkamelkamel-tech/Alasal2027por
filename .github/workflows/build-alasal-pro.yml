name: Build Alasal Pro APK

on:
  push:
    paths:
      - ".github/workflows/build-alasal-pro.yml"
      - "release/Alasal2027_project_source.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project source
        run: |
          mkdir -p extracted
          unzip -q release/Alasal2027_project_source.zip -d extracted
          PROJECT_DIR="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found in source archive"
            find extracted -maxdepth 3 -type f | head -n 80
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: gradle -p "$PROJECT_DIR" clean :app:testDebugUnitTest --console=plain

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alasal-Pro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
