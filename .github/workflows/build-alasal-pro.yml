name: Build Alasal Pro APK

on:
  push:
    paths:
      - ".github/workflows/build-alasal-pro.yml"
      - "release/Alasal2027_project_source.zip"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:

concurrency:
  group: alasal-pro-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate local debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: gradle clean :app:testDebugUnitTest --console=plain

      - name: Build Debug APK
        id: build_apk
        if: always()
        run: gradle :app:assembleDebug --console=plain

      - name: Package updated project and APK
        if: always()
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/Alasal-Pro-debug.apk
          zip -qr release/Alasal2027_project_source.zip . \
            -x ".git/*" ".gradle/*" "**/build/*" "build/*" "release/*" ".github/*"

      - name: Upload APK and source archive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alasal-pro-build
          path: |
            release/Alasal-Pro-debug.apk
            release/Alasal2027_project_source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK and source archive
        if: always() && steps.build_apk.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/Alasal-Pro-debug.apk release/Alasal2027_project_source.zip
          git commit -m "Publish updated Alasal Pro APK and project source"
          git push

